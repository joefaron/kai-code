<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4ef" stop-opacity=".75"/>
      <stop offset="1" stop-color="#1d6fa5" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset=".45" stop-color="#cfe9f7"/>
      <stop offset="1" stop-color="#9fcde6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8e8"/>
      <stop offset=".5" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#d0d0d0"/>
    </linearGradient>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" fill="#333"/></marker>
    <style>
      .lbl{font-size:17px;fill:#222}
      .b{font-weight:700}
      .lead{stroke:#333;stroke-width:1.4;fill:none;marker-end:url(#dot)}
      .h{font-size:26px;font-weight:800;fill:#123}
      .sub{font-size:16px;fill:#456}
    </style>
  </defs>

  <rect width="1200" height="920" fill="#fffdf7"/>
  <text x="30" y="44" class="h">Long-tail bottle boat: the motor stays DRY, only the prop gets wet</text>
  <text x="30" y="70" class="sub">Side view, roughly to scale (2L bottle ≈ 30 cm long). The back of the boat is on the right.</text>

  <!-- water -->
  <rect x="0" y="445" width="1200" height="175" fill="url(#water)"/>
  <path d="M0 445 q15 -5 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" stroke="#2a7fb8" stroke-width="2" fill="none"/>
  <text x="1060" y="438" class="lbl" fill="#1d5f8c" style="fill:#1d5f8c">waterline</text>

  <!-- bottle (one of two) -->
  <g>
    <rect x="150" y="345" width="470" height="166" rx="60" fill="url(#bottle)" stroke="#5aa3c8" stroke-width="2.5" opacity=".95"/>
    <path d="M150 400 q-35 0 -55 28 q20 28 55 28" fill="url(#bottle)" stroke="#5aa3c8" stroke-width="2.5"/>
    <rect x="68" y="414" width="30" height="28" rx="5" fill="#2f9e44" stroke="#1e6b2d" stroke-width="2"/>
    <line x1="240" y1="345" x2="240" y2="511" stroke="#9fcde6" stroke-width="2"/>
    <line x1="520" y1="345" x2="520" y2="511" stroke="#9fcde6" stroke-width="2"/>
  </g>

  <!-- deck -->
  <rect x="130" y="330" width="560" height="12" rx="3" fill="#e8c27a" stroke="#a37b2c" stroke-width="2"/>
  <rect x="300" y="341" width="22" height="8" fill="#888"/><rect x="470" y="341" width="22" height="8" fill="#888"/>

  <!-- tub -->
  <path d="M320 330 L335 262 L485 262 L500 330 Z" fill="#fff" stroke="#888" stroke-width="2.5"/>
  <rect x="328" y="252" width="164" height="12" rx="4" fill="#5c7cfa" stroke="#3b5bdb" stroke-width="2"/>
  <rect x="352" y="290" width="44" height="26" rx="3" fill="#1b1b1b"/><text x="374" y="308" font-size="11" fill="#fff" text-anchor="middle">ESP32</text>
  <rect x="404" y="282" width="62" height="34" rx="3" fill="#e03131"/><text x="435" y="304" font-size="11" fill="#fff" text-anchor="middle">batteries</text>

  <!-- wedge under motor -->
  <polygon points="648,330 692,330 690,316 652,293" fill="#c99a4a" stroke="#8a6420" stroke-width="2"/>

  <!-- the long tail: everything in the motor's tilted frame (30 degrees down) -->
  <g transform="translate(705 305) rotate(30)">
    <!-- motor -->
    <rect x="-52" y="-17" width="44" height="34" rx="8" fill="url(#metal)" stroke="#555" stroke-width="2"/>
    <rect x="-58" y="-9" width="8" height="18" fill="#c2410c"/>
    <line x1="-60" y1="-6" x2="-80" y2="-20" stroke="#e03131" stroke-width="2.5"/>
    <line x1="-60" y1="6" x2="-80" y2="-8" stroke="#222" stroke-width="2.5"/>
    <!-- rod -->
    <line x1="-8" y1="0" x2="335" y2="0" stroke="#777" stroke-width="4" stroke-linecap="round"/>
    <!-- silicone coupler -->
    <rect x="-6" y="-5" width="30" height="10" rx="4" fill="#d9f2ff" stroke="#4dabf7" stroke-width="2" opacity=".9"/>
    <!-- straw bearing -->
    <rect x="110" y="-6" width="190" height="12" rx="5" fill="#ffd8e4" stroke="#e64980" stroke-width="2" opacity=".85"/>
    <!-- water inside the straw: only up to the waterline (t~280) -->
    <rect x="280" y="-4" width="20" height="8" fill="#4dabf7" opacity=".9"/>
    <!-- prop -->
    <g transform="translate(330 0)">
      <rect x="-4" y="-5" width="10" height="10" rx="2" fill="#f59f00"/>
      <ellipse cx="2" cy="-12" rx="5" ry="13" fill="#fab005" stroke="#c77700" stroke-width="1.5"/>
      <ellipse cx="2" cy="12" rx="5" ry="13" fill="#fab005" stroke="#c77700" stroke-width="1.5"/>
    </g>
  </g>
  <!-- popsicle stick strut from deck to straw -->
  <line x1="682" y1="336" x2="843" y2="386" stroke="#c99a4a" stroke-width="8" stroke-linecap="round"/>
  <line x1="682" y1="336" x2="843" y2="386" stroke="#8a6420" stroke-width="1" />
  <circle cx="843" cy="386" r="5" fill="#222"/>

  <!-- travel arrow -->
  <path d="M120 580 L45 580" stroke="#2b8a3e" stroke-width="5"/>
  <polygon points="30,580 52,568 52,592" fill="#2b8a3e"/>
  <text x="62" y="608" class="lbl b" style="fill:#2b8a3e">boat goes this way</text>

  <!-- labels -->
  <path class="lead" d="M560 150 L560 232 L640 290"/>
  <text x="440" y="120" class="lbl"><tspan class="b">1. Your EUDAX motor</tspan>, glued on a wood/foam wedge</text>
  <text x="440" y="142" class="lbl">tilted 30° down. Up on the deck = always dry.</text>

  <path class="lead" d="M800 205 L728 312"/>
  <text x="760" y="175" class="lbl"><tspan class="b">2. 2 cm of silicone tube</tspan> joins the</text>
  <text x="760" y="197" class="lbl">motor shaft to the rod (flexy, forgiving)</text>

  <path class="lead" d="M990 260 L905 418"/>
  <text x="900" y="232" class="lbl"><tspan class="b">3. Drinking straw</tspan> = bearing</text>
  <text x="900" y="254" class="lbl">the rod spins inside it</text>

  <path class="lead" d="M1000 330 L960 445"/>
  <text x="1010" y="318" class="lbl"><tspan class="b">4. 2mm steel rod</tspan>,</text>
  <text x="1010" y="340" class="lbl">20 cm long</text>

  <path class="lead" d="M1080 560 L1000 478"/>
  <text x="1000" y="585" class="lbl"><tspan class="b">5. Boat prop</tspan>, under</text>
  <text x="1000" y="607" class="lbl">the water</text>

  <path class="lead" d="M760 520 L805 400"/>
  <text x="700" y="545" class="lbl"><tspan class="b">popsicle stick</tspan> holds the straw</text>

  <path class="lead" d="M270 230 L360 270"/>
  <text x="40" y="210" class="lbl"><tspan class="b">yogurt tub</tspan>: ESP32, driver,</text>
  <text x="40" y="232" class="lbl">batteries (lid on)</text>

  <path class="lead" d="M400 590 L330 500"/>
  <text x="350" y="612" class="lbl" style="fill:#fff"><tspan class="b">2L bottle</tspan>, cap ON (one of two)</text>

  <!-- why box -->
  <rect x="30" y="650" width="560" height="245" rx="14" fill="#fff4e6" stroke="#f08c00" stroke-width="2.5"/>
  <text x="50" y="684" font-size="20" font-weight="800" fill="#d9480f">Why no water gets to the motor</text>
  <text x="50" y="716" class="lbl">The straw's top end is <tspan class="b">above the waterline</tspan>. Water can</text>
  <text x="50" y="740" class="lbl">only climb a straw as high as the water outside (the</text>
  <text x="50" y="764" class="lbl">little blue bit at its bottom end), so it can never reach</text>
  <text x="50" y="788" class="lbl">the motor. <tspan class="b">No seals, no Vaseline, no holes in the bottle.</tspan></text>
  <text x="50" y="822" class="lbl">This is the "down and out" shaft you remember: real</text>
  <text x="50" y="846" class="lbl">"long-tail" boats in Thailand work exactly this way.</text>
  <text x="50" y="878" class="lbl" style="fill:#666">The motor still turns the same way: shaft → rod → prop.</text>

  <!-- top view -->
  <text x="630" y="676" font-size="20" font-weight="800" fill="#123">Top view: steering</text>
  <g transform="translate(630 690)">
    <rect x="0" y="10" width="300" height="190" fill="#7cc4ef" opacity=".35" rx="8"/>
    <rect x="20" y="30" width="200" height="50" rx="22" fill="url(#bottle)" stroke="#5aa3c8" stroke-width="2"/>
    <rect x="20" y="130" width="200" height="50" rx="22" fill="url(#bottle)" stroke="#5aa3c8" stroke-width="2"/>
    <rect x="10" y="40" width="226" height="130" rx="4" fill="#e8c27a" stroke="#a37b2c" stroke-width="2" opacity=".85"/>
    <rect x="80" y="80" width="70" height="50" rx="6" fill="#fff" stroke="#888" stroke-width="2"/>
    <text x="115" y="110" font-size="12" text-anchor="middle" fill="#333">tub</text>
    <rect x="200" y="45" width="28" height="22" rx="5" fill="url(#metal)" stroke="#555"/>
    <rect x="200" y="143" width="28" height="22" rx="5" fill="url(#metal)" stroke="#555"/>
    <line x1="228" y1="56" x2="292" y2="56" stroke="#777" stroke-width="3"/>
    <line x1="228" y1="154" x2="292" y2="154" stroke="#777" stroke-width="3"/>
    <ellipse cx="292" cy="56" rx="4" ry="14" fill="#fab005" stroke="#c77700"/>
    <ellipse cx="292" cy="154" rx="4" ry="14" fill="#fab005" stroke="#c77700"/>
    <text x="320" y="60" class="lbl">right motor</text>
    <text x="320" y="158" class="lbl">left motor</text>
  </g>
  <text x="630" y="912" class="lbl" style="font-size:15px">Both fast = straight · slow one side = turn that way (same code as the fan boat)</text>
</svg>
